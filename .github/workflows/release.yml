name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    name: Build Windows executable
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --windowed --name ThermalPlot src/main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThermalPlot-Windows.exe
          path: dist/ThermalPlot.exe

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts (debug)
        run: |
          ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/*/*
          body: |
            ## ThermalPlot ${{ github.ref_name }}
            
            A Windows GUI tool for visualizing BMC temperature and fan duty data.
            
            ### Download
            - **ThermalPlot-Windows.exe** - Windows GUI application
            
            ### Installation
            1. Download ThermalPlot-Windows.exe
            2. (Optional) Copy the `config/` folder to the same directory for custom settings
            3. Run the executable
            
            ### Features
            - GUI plotting tool for thermal data visualization
            - Support for temperature and fan duty data from IPMI
            - Customizable plot styles (fonts, colors, legend position, title position)
            - Custom image export with selectable dimensions and DPI
            - Batch file loading support
            - Interactive charts with hover tooltips
            
            ### Data Collection
            Data collection scripts support both Windows and Linux. Use the appropriate script from the `scripts/` folder to record IPMI thermal data.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
